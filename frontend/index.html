<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      One index.html serves the whole SPA, storefront and admin alike, so this
      is the icon for both. Served from the app's own origin rather than
      Cloudinary: a tab icon should not depend on a third party being reachable,
      and it is fetched on every cold load.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>LacedUp Co.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
